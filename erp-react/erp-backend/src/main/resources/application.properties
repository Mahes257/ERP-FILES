# ============================================
# Environment-driven configuration
# ============================================
# Values are read from OS environment variables (ERP_*) or from a .env file
# placed next to the backend (copy .env.example). SECURITY: secrets have NO
# hardcoded fallbacks — if ERP_JWT_SECRET / ERP_DATABASE_USERNAME /
# ERP_DATABASE_PASSWORD are missing, the application FAILS FAST at startup
# instead of running with a known (public) default.
spring.config.import=optional:file:.env[.properties]

# ============================================
# Application
# ============================================
spring.application.name=erp-backend
server.port=${ERP_PORT:8080}
server.servlet.context-path=/v1

# Base URL used to build absolute download links for attachments
app.base-url=${ERP_BASE_URL:http://localhost:8080}

# ============================================
# MySQL
# ============================================
# NOTE: use a dedicated application user (see docs/mysql-app-user.sql), never
# MySQL root. createDatabaseIfNotExist was removed on purpose — the app user
# must not be able to create databases, and pointing the app at an existing
# erp_db must never create or initialise one.
#
# Connection target: HOST / PORT / NAME are separate so the same build connects
# to another laptop's MySQL (different port, other host, container, VPN) by
# setting environment values only. ERP_DATABASE_URL is a full override that wins
# over all three when a deployment needs extra JDBC parameters.
spring.datasource.url=${ERP_DATABASE_URL:jdbc:mysql://${ERP_DATABASE_HOST:localhost}:${ERP_DATABASE_PORT:3306}/${ERP_DATABASE_NAME:erp_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ERP_DATABASE_USERNAME}
spring.datasource.password=${ERP_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================================
# HikariCP — sized for the 100-concurrent-user target
# ============================================
# 50 connections is the INITIAL target, not a proven optimum: validate it under
# the staging load test (docs/load-testing.md) and watch
# hikaricp_connections_pending / hikaricp_connections_active before changing it.
# A pending count that stays above zero means request threads are waiting on the
# pool; size the pool and Tomcat threads together, never one alone.
spring.datasource.hikari.pool-name=ErpHikariPool
spring.datasource.hikari.maximum-pool-size=${ERP_DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${ERP_DB_POOL_MIN_IDLE:10}
# Wait at most 12s for a connection, then fail fast instead of holding the HTTP
# thread for Hikari's 30s default.
spring.datasource.hikari.connection-timeout=${ERP_DB_POOL_CONNECTION_TIMEOUT_MS:12000}
spring.datasource.hikari.idle-timeout=${ERP_DB_POOL_IDLE_TIMEOUT_MS:300000}
# 25 minutes — below MySQL's default wait_timeout (8h) and any common proxy/DB
# idle cutoff, so a pooled connection is recycled before the server closes it.
spring.datasource.hikari.max-lifetime=${ERP_DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${ERP_DB_POOL_KEEPALIVE_MS:300000}
# One logical connection held longer than this is logged as a probable leak
# (0 disables it). 60s is far above the slowest normal request; raise it if the
# report/export paths legitimately run longer.
spring.datasource.hikari.leak-detection-threshold=${ERP_DB_LEAK_DETECTION_MS:60000}
spring.datasource.hikari.register-mbeans=true

# Tomcat worker capacity. 200 request threads sit above the 50-connection pool
# on purpose: requests that do not touch the database (static assets, file
# downloads, websocket handshakes) must not be starved by database work, while
# the pool remains the hard ceiling on concurrent database access. The queue is
# bounded so an overload is rejected quickly rather than accumulating.
server.tomcat.threads.max=${ERP_TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${ERP_TOMCAT_MIN_SPARE_THREADS:25}
server.tomcat.accept-count=${ERP_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${ERP_TOMCAT_MAX_CONNECTIONS:8192}

# Graceful shutdown: stop accepting new requests, let in-flight work finish
# (including multipart uploads and scheduled jobs), then close the pool.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${ERP_SHUTDOWN_TIMEOUT:30s}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Never mutate the existing database implicitly. Use an explicitly configured
# migration process for schema changes; production defaults to mapping
# validation so missing/incorrect columns fail at startup instead of creating
# duplicate or drifted tables.
spring.jpa.hibernate.ddl-auto=${ERP_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT
# ============================================
# SECURITY: no default. Generate a strong secret, e.g.:
#   openssl rand -base64 64
app.jwt.secret=${ERP_JWT_SECRET}
# Access-token lifetime: 30 minutes (short-lived + refresh tokens).
app.jwt.expiration-ms=${ERP_JWT_EXPIRATION_MS:1800000}
# Refresh-token lifetime: 7 days.
app.jwt.refresh-expiration-ms=${ERP_JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================
# Local-development auto-login
# ============================================
# DISABLED BY DEFAULT. When enabled, POST /auth/local-auto-login issues a
# normal session (real JWT + refresh token) for the user below, but ONLY to
# loopback requests that did not arrive through a proxy/tunnel; every other
# caller is refused. The account must already exist — nothing is created and no
# role is granted. Never enable this on a deployed/shared instance.
app.local-auto-login.enabled=${ERP_LOCAL_AUTO_LOGIN_ENABLED:false}
app.local-auto-login.user=${ERP_LOCAL_AUTO_LOGIN_USER:}

# ============================================
# File uploads
# ============================================
app.upload.dir=${ERP_UPLOAD_DIR:uploads}
# Shared attachment capacity across ALL modules (attachments, CPR documents,
# lead/customer files, ...). Configurable because 4 GB is a deployment decision,
# not a product constant: set ERP_ATTACHMENT_POOL_BYTES to the volume capacity
# you actually provision, minus headroom for the database, logs and backups.
# The ledger and the UI read the same value through GET /files/storage.
app.attachments.pool-bytes=${ERP_ATTACHMENT_POOL_BYTES:4294967296}
# Simultaneous attachment writes. A large upload streams to disk and holds a
# multipart spool copy, so unbounded concurrency can exhaust a volume; this is
# the hard ceiling. Raise only with the staging test's disk-throughput numbers.
app.upload.max-concurrent=${ERP_MAX_CONCURRENT_UPLOADS:4}
# How long an upload waits for a slot before failing with 429 + Retry-After.
app.upload.acquire-timeout-ms=${ERP_UPLOAD_ACQUIRE_TIMEOUT_MS:30000}
# Refuse a new write when the upload volume has less than this much free space
# (507). Protects the OS, the database and every other file on the volume.
app.upload.min-free-bytes=${ERP_UPLOAD_MIN_FREE_BYTES:5368709120}
# Every other runtime storage root derives from app.upload.dir, so one
# ERP_UPLOAD_DIR moves ALL persistent upload data (attachments, CAD model
# originals, drawing originals, CAD previews, processing-job staging) onto a
# single external volume. Pointing only app.upload.dir at a volume used to
# leave models and drawings behind in a working-directory-relative
# ./uploads/{models,drawings} that a redeploy could discard.
#   models   — original CAD model files (production module, app.storage.models)
#   drawings — original drawing files (production module, app.storage.drawings)
# Each has its own override, and with ERP_UPLOAD_DIR unset these resolve to
# uploads/models and uploads/drawings — the previous layout, unchanged.
app.storage.models=${ERP_MODEL_STORAGE_DIR:${app.upload.dir}/models}
app.storage.drawings=${ERP_DRAWINGS_STORAGE_DIR:${app.upload.dir}/drawings}
# Per-file upload limit: 2 GB. This is a product-level limit, not a server
# tuning knob — the UI states "up to 2GB per file" in every attachment zone and
# the browser refuses larger files before sending a byte, so lowering
# ERP_MAX_FILE_SIZE alone would accept less than the product offers. Lower it and
# the frontend mirror (src/utils/attachmentStorage.js) together, or not at all.
spring.servlet.multipart.max-file-size=${ERP_MAX_FILE_SIZE:2GB}
# Whole-request cap (one value covers multi-file batches). Must stay above
# max-file-size to leave room for multipart framing.
spring.servlet.multipart.max-request-size=${ERP_MAX_REQUEST_SIZE:2200MB}
# Parts are written straight to disk, never buffered in the JVM heap: the peak
# heap cost of a 2 GB upload is one 64 KB copy buffer (see util/UploadStreams).
spring.servlet.multipart.file-size-threshold=${ERP_UPLOAD_DISK_THRESHOLD:0B}
# Explicit spool directory (created at startup). Two copies of a large upload sit
# on disk at once — the spool copy here, then the stored copy under
# app.upload.dir — so this must have room for max-request-size x concurrent
# uploads. Point ERP_UPLOAD_TEMP_DIR at a suitable volume in production.
spring.servlet.multipart.location=${ERP_UPLOAD_TEMP_DIR:${java.io.tmpdir}/erp-upload-spool}
# A rejected upload is NOT drained: after a 413 (either the early Content-Length
# gate or the container limit) the connection closes instead of the server
# reading the rest of a multi-gigabyte body to keep it alive. This restores the
# framework default; the previous 2200MB let one bad request cost 2.2 GB of read.
server.tomcat.max-swallow-size=${ERP_MAX_SWALLOW_SIZE:2MB}
# Parts allowed in one multipart request. Bulk extraction accepts up to
# app.processing-jobs.max-files (25) documents per batch, so this must stay above
# that; the framework default is 50.
server.tomcat.max-part-count=${ERP_MAX_PART_COUNT:50}
# Lead CSV import cap: the importer parses the whole file as text, so it is
# bounded. An import above this is refused with a clear 400 rather than loaded.
# (MAX_IMPORT_ROWS=5000 rows is far below this for legitimate imports.)
app.upload.lead-import-max-bytes=${ERP_LEAD_IMPORT_MAX_BYTES:20971520}
# Extensions accepted for uploads (lowercase, no dots). Anything else is
# rejected server-side before the file is stored.
app.upload.allowed-extensions=${ERP_UPLOAD_ALLOWED_EXTENSIONS:pdf,doc,docx,xls,xlsx,csv,txt,png,jpg,jpeg,gif,webp,zip,step,stp,iges,igs,stl,obj,glb,gltf}

# ============================================
# Background processing jobs
# ============================================
# Heavy parsing (Sales Contract bulk upload: PDFBox/Apache POI over a whole
# batch) no longer runs on an HTTP worker: the request validates, stages the
# documents, creates a durable job and returns 202; the job runs on this pool
# and the client polls for its status and result.
#
# Each running job holds one worker permit, so `concurrency` is the hard ceiling
# on simultaneous heavy work. Extra submissions stay QUEUED in the database and
# drain oldest-first — that queue is what survives an application restart.
app.processing-jobs.concurrency=${ERP_PROCESSING_JOBS_CONCURRENCY:2}
app.processing-jobs.queue-capacity=${ERP_PROCESSING_JOBS_QUEUE_CAPACITY:25}
# Queue sweep interval (ms): how quickly a queued backlog starts when every
# worker is busy, and how often interrupted jobs are recovered. Jobs submitted
# normally start immediately (no sweep needed), so this only bounds the backlog
# latency; on an empty queue it is two indexed lookups. Raise it to trade start
# latency for less idle polling.
app.processing-jobs.dispatch-interval-ms=${ERP_PROCESSING_JOBS_DISPATCH_INTERVAL_MS:5000}
# Retention of finished jobs and orphaned staging folders.
app.processing-jobs.housekeep-interval-ms=${ERP_PROCESSING_JOBS_HOUSEKEEP_INTERVAL_MS:900000}
app.processing-jobs.dispatch-batch-size=${ERP_PROCESSING_JOBS_DISPATCH_BATCH_SIZE:10}
# Retries per job; a PROCESSING row older than the stale timeout is treated as
# interrupted (killed process) and re-queued, or failed once retries are spent.
app.processing-jobs.max-attempts=${ERP_PROCESSING_JOBS_MAX_ATTEMPTS:2}
app.processing-jobs.stale-timeout-ms=${ERP_PROCESSING_JOBS_STALE_TIMEOUT_MS:600000}
# Finished jobs are kept this long so a slow client can still collect a result.
app.processing-jobs.retention-hours=${ERP_PROCESSING_JOBS_RETENTION_HOURS:24}
# Bulk-extraction batch limits (enforced before anything is staged).
app.processing-jobs.max-files=${ERP_PROCESSING_JOBS_MAX_FILES:25}
app.processing-jobs.max-file-bytes=${ERP_PROCESSING_JOBS_MAX_FILE_BYTES:104857600}
app.processing-jobs.max-total-bytes=${ERP_PROCESSING_JOBS_MAX_TOTAL_BYTES:314572800}

# ============================================
# CORS — trusted frontend origins (no wildcards with credentials)
# ============================================
# Comma-separated list. The same-origin Vite proxy does not need CORS at all;
# this only matters when the frontend is served from a different origin than
# the API. Set ERP_CORS_ALLOWED_ORIGINS to the real ERP frontend domain(s) in
# production. The development frontend is pinned to port 5173 (strictPort in
# vite.config.js), so only that origin is listed; 4173 is `vite preview`.
app.cors.allowed-origins=${ERP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# ============================================
# Security headers
# ============================================
# Enable HSTS only when the site is served over HTTPS (production). The header
# is only emitted for secure requests regardless.
app.security.hsts=${ERP_SECURITY_HSTS:false}
app.security.hsts-max-age=${ERP_SECURITY_HSTS_MAX_AGE:31536000}

# ============================================
# Rate limiting (in-memory, per instance)
# ============================================
app.rate-limit.login.max-per-ip=${ERP_RATE_LIMIT_LOGIN_IP:20}
app.rate-limit.login.max-per-email-ip=${ERP_RATE_LIMIT_LOGIN_EMAIL_IP:10}
app.rate-limit.login.window-minutes=${ERP_RATE_LIMIT_LOGIN_WINDOW:15}
app.rate-limit.register.max-per-ip=${ERP_RATE_LIMIT_REGISTER_IP:5}
app.rate-limit.register.window-minutes=${ERP_RATE_LIMIT_REGISTER_WINDOW:60}
app.rate-limit.refresh.max-per-ip=${ERP_RATE_LIMIT_REFRESH_IP:60}
app.rate-limit.refresh.window-minutes=${ERP_RATE_LIMIT_REFRESH_WINDOW:15}

# ============================================
# JSON
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================
# Exchange rates (centralized service)
# ============================================
# Public keyless provider: open.er-api.com (ExchangeRate-API free endpoint).
exchange.api.url=${ERP_EXCHANGE_API_URL:https://open.er-api.com/v6/latest/{base}}
exchange.refresh.hours=24
exchange.base.default=INR

# CAD conversion pipeline switch. Individual engines are resolved at runtime;
# formats with no configured engine honestly report UNSUPPORTED.
app.cad-convert.enabled=${ERP_CAD_CONVERT_ENABLED:true}

# ============================================
# FreeCAD (optional conversion engine, disabled by default)
# ============================================
# When enabled AND an executable is found, FreeCAD becomes the preferred
# engine for STEP/STP/IGES/IGS conversion (otherwise the registered STEP->GLB
# engine slot is used when one is present). SLDPRT/SLDASM are only converted
# by FreeCAD builds that genuinely ship a SolidWorks importer (probed at
# runtime); stock FreeCAD has no native SLDPRT importer, so those formats stay
# honestly UNSUPPORTED with a clear message.
#
# freecad-command may be a full path, e.g.
#   C:\Program Files\FreeCAD 1.0\bin\FreeCADCmd.exe
# or a command name resolved on PATH. Leave it blank to auto-discover any
# "FreeCAD *\bin\FreeCADCmd.exe" install under %ProgramFiles% on Windows.
# Never hardcode a version-specific path in code — configure it here.
app.cad-convert.freecad-enabled=${ERP_FREECAD_ENABLED:false}
app.cad-convert.freecad-command=${ERP_FREECAD_COMMAND:}
app.cad-convert.freecad-timeout-seconds=${ERP_FREECAD_TIMEOUT:240}

# ============================================
# cadmpeg (SolidWorks container -> CADIR -> GLB)
# ============================================
# The engine behind the proven Mech R&D SLDPRT/SLDASM pipeline: cadmpeg decodes
# the SolidWorks container into CADIR (JSON) preserving the tessellation
# SolidWorks itself computed, and the worker turns that tessellation into a GLB
# (see CadirToGlbBuilder). No license, no STEP hop, no re-tessellation.
#
# cadmpeg is an EXTERNAL runtime dependency — it is not bundled with this
# repository and cannot be installed automatically. It is a Windows executable
# (the CAD worker host must be Windows; the ERP itself can stay on Linux).
#
# Path resolution when cadmpeg-path is blank:
#   1. %USERPROFILE%\.cargo\bin\cadmpeg.exe   (cadmpeg's documented location)
#   2. "cadmpeg.exe" on PATH
# When the binary is missing the engine reports itself UNAVAILABLE with an
# actionable message and refuses the job — it never claims a fake conversion.
app.cad-convert.cadmpeg-enabled=${ERP_CADMPEG_ENABLED:true}
app.cad-convert.cadmpeg-path=${ERP_CADMPEG_PATH:}
# Must stay BELOW app.cad.worker.timeout-seconds (420) so cadmpeg fails first
# with its own precise reason instead of being killed by the worker.
app.cad-convert.cadmpeg-timeout-seconds=${ERP_CADMPEG_TIMEOUT:300}

# ============================================
# ACIS SAT (cadmpeg ACIS decode + OpenCascade tessellation)
# ============================================
# SAT carries B-rep geometry only and no free standalone tessellator for it
# exists, so this engine chains two real, already-present components:
#   1. cadmpeg decodes the ACIS SAT B-rep and writes a neutral STEP (AP214);
#   2. the project's bundled OpenCascade WASM importer (occt-import-js, a Node
#      dependency of this repository) tessellates that STEP into triangles via
#      tools/cad/sat/step-to-cadir.cjs;
#   3. CadirToGlbBuilder turns the triangles into the SAME GLB artifact every
#      other converted format produces (the viewer still receives a GLB).
# STEP is an intermediate only — never shown and never a fake preview.
#
# node is an EXTERNAL runtime dependency (the same Node.js that builds the
# frontend). When cadmpeg, Node or the helper is missing the engine reports
# itself UNAVAILABLE with an actionable message and refuses the job.
#
# Resolution (all optional, no machine-specific defaults):
#   sat-node-path          full path or a command name on PATH; blank = PATH.
#   sat-tessellator-script  default: <project>/tools/cad/sat/step-to-cadir.cjs.
#   sat-occt-module        absolute occt-import-js package dir for a packaged
#                          deployment; blank = normal Node resolution.
app.cad-convert.sat-enabled=${ERP_SAT_ENABLED:true}
app.cad-convert.sat-node-path=${ERP_SAT_NODE_PATH:}
app.cad-convert.sat-tessellator-script=${ERP_SAT_TESSELLATOR_SCRIPT:}
app.cad-convert.sat-occt-module=${ERP_SAT_OCCT_MODULE:}
# Must stay BELOW app.cad.worker.timeout-seconds (420) so this engine fails
# first with its own precise reason instead of being killed by the worker.
app.cad-convert.sat-timeout-seconds=${ERP_SAT_TIMEOUT:300}

# ============================================
# CAD conversion worker (isolated process)
# ============================================
# SLDPRT / SLDASM / SAT previews are produced OUTSIDE the request threads by a
# dedicated worker process sharing only the database queue:
#
#   # ERP (never loads worker beans):
#   java -jar erp-backend.jar
#   # isolated CAD worker (no web layer, binds NO port):
#   java -jar erp-backend.jar --erp.cad.worker.mode=true
#   # or: ERP_CAD_WORKER_MODE=true
#
# Coordination is the cad_conversion_jobs table (atomic claim) plus a
# heartbeat row for health. There is no HTTP conversion endpoint for the
# worker to expose — the only entry point is the JWT-protected
# POST /v1/models/{id}/cad-conversion on the ERP.
#
# Limits are conservative for a single server and fully env-overridable.
# timeout-seconds must stay above every engine timeout (FreeCAD 240 s) so the
# engine always fails first with its own precise reason.
app.cad.worker.enabled=${ERP_CAD_WORKER_ENABLED:true}
app.cad.worker.max-concurrent-jobs=${ERP_CAD_WORKER_MAX_CONCURRENT:1}
app.cad.worker.max-file-bytes=${ERP_CAD_WORKER_MAX_FILE_BYTES:209715200}
app.cad.worker.timeout-seconds=${ERP_CAD_WORKER_TIMEOUT_SECONDS:420}
app.cad.worker.poll-interval-ms=${ERP_CAD_WORKER_POLL_MS:2000}
app.cad.worker.recovery-interval-ms=${ERP_CAD_WORKER_RECOVERY_MS:30000}
app.cad.worker.housekeep-interval-ms=${ERP_CAD_WORKER_HOUSEKEEP_MS:900000}
app.cad.worker.stale-timeout-seconds=${ERP_CAD_WORKER_STALE_TIMEOUT_SECONDS:600}
app.cad.worker.heartbeat-stale-seconds=${ERP_CAD_WORKER_HEARTBEAT_STALE_SECONDS:60}
app.cad.worker.max-queued-jobs=${ERP_CAD_WORKER_MAX_QUEUED:50}
# Staging root: <root>/<jobId>/{input,output,metadata} — job ids only, never a
# user-supplied file name. Blank = ${java.io.tmpdir}/cad-jobs.
app.cad.worker.temp-root=${ERP_CAD_WORKER_TEMP_ROOT:}
# Controlled GLB storage (served only via authenticated /models/{id}/3d).
# Defaults to <app.upload.dir>/cad-previews so previews live on the same
# persistent volume as the uploads they describe. Never a public/static directory.
app.cad.worker.preview-dir=${ERP_CAD_WORKER_PREVIEW_DIR:${app.upload.dir}/cad-previews}
app.cad.worker.allowed-file-types=${ERP_CAD_WORKER_FILE_TYPES:sldprt,sldasm,sat}
app.cad.worker.preview-retention-hours=${ERP_CAD_WORKER_PREVIEW_RETENTION_HOURS:168}
app.cad.worker.job-retention-days=${ERP_CAD_WORKER_JOB_RETENTION_DAYS:30}
app.cad.worker.temp-retention-hours=${ERP_CAD_WORKER_TEMP_RETENTION_HOURS:24}

# ============================================
# Notification reminder scheduler
# ============================================
# How often the reminder poller runs (fixed delay, in milliseconds).
# 5 minutes is the production default: a due reminder is delivered on the first
# run after its scheduled time, and the per-reminder cadence (30s for test
# reminders, 2 hours otherwise) is unchanged — only the polling frequency drops.
# Lower it (e.g. 30000) for the original 30-second test/POC reminder workflow:
#   ERP_NOTIFICATION_REMINDER_INTERVAL_MS=30000
app.notification.reminder-interval-ms=${ERP_NOTIFICATION_REMINDER_INTERVAL_MS:300000}
# Reminders fired per run (oldest due first). Bounds the query, the reminder
# inserts and the WebSocket pushes of one run; a backlog drains over the
# following runs instead of being processed in a single burst.
app.notification.reminder-batch-size=${ERP_NOTIFICATION_REMINDER_BATCH_SIZE:200}
# Inbox listing page defaults. The endpoint stays array-compatible (the existing
# frontend array contract is unchanged) but is now bounded: callers may pass
# ?page=&size=, and the server caps a page at list-max-size.
app.notification.list-default-size=${ERP_NOTIFICATION_LIST_SIZE:100}
app.notification.list-max-size=${ERP_NOTIFICATION_LIST_MAX_SIZE:500}
# Candidate batch size for the state-based sweeps. Each sweep processes a
# bounded page of CURRENT rows that can still notify, so one run can never load
# a whole table and a large backlog drains over successive runs.
app.notification.sweep-batch-size=${ERP_NOTIFICATION_SWEEP_BATCH_SIZE:200}
# Rounds per detector per run (200 x 5 = 1000 candidates max). A larger backlog
# drains on the following runs rather than holding a scheduler thread for long.
app.notification.sweep-max-batches=${ERP_NOTIFICATION_SWEEP_MAX_BATCHES:5}

# ============================================
# Logging
# ============================================
# One concise line per API request is emitted by ApiRequestLoggingFilter:
#     [API] GET /v1/purchase/orders → 200 (12ms)
# WARN for 4xx, ERROR for 5xx, INFO otherwise. No second request logger exists.
#
# Application events stay at INFO; the framework below is held at WARN so a
# normal run is not flooded with Spring MVC / Tomcat / Hibernate / HikariCP /
# Spring Security / WebSocket lifecycle chatter. This is a level change only:
# every WARN and ERROR from those frameworks, every exception and every
# startup failure is still written to the console. Nothing is set to OFF.
logging.level.com.vishatech.erp=INFO
# Security events are logged under the "SECURITY" logger for easy filtering.
logging.level.SECURITY=INFO
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.eclipse.jetty=WARN
logging.level.io.undertow=WARN

# ============================================
# Master-data cache (Caffeine)
# ============================================
# Set to false to disable caching entirely (every master-data read hits the DB).
enable.cache=${APP_CACHE_ENABLED:true}
app.cache.enabled=${APP_CACHE_ENABLED:true}
# Max entries per cache region before Caffeine evicts the least-recently-used.
app.cache.masters.maximum-size=${APP_CACHE_MASTERS_MAX_SIZE:100}
# Time-to-live after a cache entry is written (minutes). After this time the
# next read repopulates from the database.
app.cache.masters.ttl-minutes=${APP_CACHE_MASTERS_TTL_MINUTES:60}

# ============================================
# Actuator & Micrometer metrics
# ============================================
# Expose only production-safe endpoints. health + info are public (used by
# load-balancers and orchestrators); everything else — including /metrics and
# /mappings, which describe the whole JVM, DB pool and schema — requires a
# valid JWT (see SecurityConfig). Do not make the scrape endpoint public: it
# names internal endpoints and connection counts.
#
# Prometheus scraping is optional: add micrometer-registry-prometheus and put
# 'prometheus' back in this list. Without that dependency the endpoint does not
# exist, so it is not advertised here.
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# Health probes used by the reverse proxy / orchestrator:
# /v1/actuator/health/liveness and /v1/actuator/health/readiness (the app
# context path is /v1, so the actuator base path sits under it).
management.endpoint.health.probes.enabled=true
# Disk-capacity health: the upload volume is where attachments, CAD originals
# and spool files live. DOWN below the threshold is intentional — a full volume
# breaks uploads and can corrupt processing jobs.
management.health.diskspace.enabled=true
management.health.diskspace.path=${app.upload.dir}
management.health.diskspace.threshold=${ERP_DISK_MIN_FREE_BYTES:5368709120}
# HTTP latency histograms so the staging run can report real P50/P95/P99 from
# /v1/actuator/metrics/http.server.requests (not only from the load tool).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Actuator lives at /v1/actuator/* because the base path is relative to the
# /v1 servlet context path. It is not merged into the application API paths.
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${ERP_METRICS_ENV:local}
# JVM, HTTP, DB-pool and logback metrics are auto-configured by Micrometer.
# Add custom ERP-specific tags here:
# management.metrics.tags.module=erp
