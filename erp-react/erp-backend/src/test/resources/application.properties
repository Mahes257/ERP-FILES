# ============================================
# Test configuration — H2 in-memory (MySQL compatibility mode).
# This file SHADOWS src/main/resources/application.properties on the test
# classpath, so the dev .env / MySQL are never touched by tests.
# The H2 URL (incl. the INIT=... that defines TEXT/LONGTEXT domains) is
# injected by AbstractSecurityTest via @DynamicPropertySource.
# ============================================
spring.config.import=

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# H2Dialect + globally-quoted identifiers: reserved words such as "value"
# get quoted ("value"), which H2 accepts.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.hbm2ddl.schema_filter_provider=com.vishatech.erp.security.AuditSchemaFilterProvider
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.servlet.context-path=/v1

# Test-only signing key (fixed, valid base64, never used at runtime).
app.jwt.secret=Hco4cs6N8SY5qIy0TYreZr49GVxfaS8+rQRnmEEof8P0ntMTV/nyQ8QQ1WVIIQmGWRlh5VWAH4+/idcPqGm9iw==
app.jwt.expiration-ms=1800000
app.jwt.refresh-expiration-ms=604800000

app.base-url=http://localhost:8080
app.upload.dir=target/test-uploads
app.upload.allowed-extensions=pdf,doc,docx,xls,xlsx,csv,txt,png,jpg,jpeg,gif,webp,zip
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2200MB
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.location=target/test-upload-spool
server.tomcat.max-swallow-size=2MB
server.tomcat.max-part-count=50
app.upload.lead-import-max-bytes=20971520

app.cors.allowed-origins=http://localhost:5173

exchange.api.url=https://open.er-api.com/v6/latest/{base}
exchange.refresh.hours=24
exchange.base.default=INR

# Background processing-job sweeps are disabled by default in tests.
# Several cached Spring test contexts share one in-memory H2 database, and each
# context runs its own scheduler against that shared queue. A context whose
# staging directory differs would otherwise claim (and fail) another context's
# queued job. Tests that exercise the pipeline drive it deterministically through
# ProcessingJobService (see ProcessingJobPipelineTests, which sets the same value).
app.processing-jobs.dispatch-interval-ms=3600000
app.processing-jobs.housekeep-interval-ms=3600000

logging.level.com.vishatech.erp=WARN
logging.level.SECURITY=WARN
