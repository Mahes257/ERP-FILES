# ============================================================================
# ERP reverse proxy — nginx
# ============================================================================
# Terminates TLS, serves the built React SPA, and proxies the Spring Boot API
# (context path /v1) and its WebSocket endpoint. The backend binds to loopback
# only; this is the only public entry point.
#
# Replace:
#   erp.example.com          your DNS name
#   /etc/letsencrypt/...     your certificate paths (certbot shown)
#   /opt/erp/frontend        the uploaded contents of erp-react/dist
#   erp_backend              127.0.0.1:8080 unless ERP_PORT differs
#
# Apply, then: nginx -t && systemctl reload nginx
# ============================================================================

upstream erp_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP → HTTPS. Keep the ACME challenge path reachable for renewals.
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.example.com;

    # ---- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The SPA needs no plugin/object embedding; tighten further if you add none.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Upload capacity -----------------------------------------------------
    # Matches ERP_MAX_REQUEST_SIZE (2200 MB). Keep this at or above the backend
    # limit; a smaller proxy limit produces a 413 before the app can explain it.
    client_max_body_size 2200m;
    client_body_timeout 1800s;
    client_body_buffer_size 256k;
    # Stream the body to Spring instead of spooling a second multi-GB copy.
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # ---- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # ---- API -----------------------------------------------------------------
    location /v1/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Do not let nginx cache API responses.
        proxy_buffering off;
    }

    # ---- WebSocket (STOMP endpoint lives under the /v1 context path) ----------
    location /v1/ws/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- Actuator: local scrapers only ---------------------------------------
    # The app context path is /v1, so the endpoints live at /v1/actuator/*
    # (e.g. /v1/actuator/health, /v1/actuator/metrics). This longer prefix
    # takes precedence over location /v1/. Metrics and Prometheus expose
    # internals, so keep them off the public internet; scrape from the host or
    # a private network.
    location /v1/actuator/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://erp_backend;
        proxy_set_header Host $host;
    }

    # ---- SPA -----------------------------------------------------------------
    root /opt/erp/frontend;
    index index.html;

    # Hashed build assets are immutable; HTML must always revalidate so a deploy
    # is visible immediately.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        # Client-side routes (/sales/..., /cprs/...) must fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    # Brand images generated by the frontend build (public/brand).
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
